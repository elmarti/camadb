name: Release

on:
  push:
    branches:
      - main
    paths:
      - packages/**
      - .changeset/**
      - .github/workflows/release.yaml

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish workspace packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Resolve affected workspaces
        env:
          BASE_SHA: ${{ github.event.before }}
        run: echo "AFFECTED_WORKSPACES=$(node scripts/affected-workspaces.js "$BASE_SHA" "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Validate affected workspaces
        run: yarn validate:affected

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          version: yarn version-packages
          publish: yarn release
          title: 'chore: release workspace packages'
          commit: 'chore: release workspace packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
