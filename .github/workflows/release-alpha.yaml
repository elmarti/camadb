name: Alpha release

on:
  push:
    branches:
      - develop
    paths:
      - packages/**
      - .changeset/**
      - .github/workflows/release-alpha.yaml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-alpha
  cancel-in-progress: false

jobs:
  release-alpha:
    name: Publish develop snapshots
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Resolve affected workspaces
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: echo "AFFECTED_WORKSPACES=$(node scripts/affected-workspaces.js "$BASE_SHA" "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Select all workspaces for a manual release
        if: github.event_name == 'workflow_dispatch'
        run: echo "AFFECTED_WORKSPACES=$(node scripts/affected-workspaces.js --all)" >> "$GITHUB_ENV"

      - name: Validate affected workspaces
        run: yarn validate:affected

      - name: Create unique alpha snapshot versions
        run: yarn version:alpha

      - name: Rebuild versioned packages
        run: yarn build:affected

      - name: Publish to the alpha channel
        run: yarn release:alpha
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
