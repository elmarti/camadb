name: Deploy public website

on:
  push:
    branches:
      - main
    paths:
      - apps/knowledge-demo/**
      - apps/website/**
      - packages/core/**
      - packages/design/**
      - packages/memory/**
      - package.json
      - .github/workflows/deploy-docs.yaml

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build static website and demo
        env:
          CAMADB_BASE_PATH: /camadb
        run: |
          yarn workspace @camadb/core build
          yarn workspace @camadb/memory build
          yarn workspace @camadb/knowledge-demo build
          yarn workspace @camadb/website build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/website/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
